<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk - Zeintin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.cdnfonts.com/css/gilroy-bold');
        @import url('https://fonts.cdnfonts.com/css/vogue');

        * {
            font-family: 'Gilroy-Regular', sans-serif;
        }

        .gbold {
            font-family: 'Gilroy-Bold', sans-serif;
        }

        .gheavy {
            font-family: 'Gilroy-Heavy', sans-serif;
        }

        .glight {
            font-family: 'Gilroy-Light', sans-serif;
        }

        .gmed {
            font-family: 'Gilroy-Medium', sans-serif;
        }

        .vogue {
            font-family: 'Vogue', sans-serif;
        }

        @font-face {
            font-family: 'Gilroy-ExtraBold';
            src: url('./assets/fonts/Gilroy-ExtraBold.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        .gilroyExtraBold {
            font-family: 'Gilroy-ExtraBold', sans-serif;
        }

        /* Dynamic Outline Utilities */
        .text-outline-white {
            color: transparent;
            -webkit-text-stroke: 2px white;
        }

        .text-outline-red {
            color: transparent;
            -webkit-text-stroke: 2px #F20000;
        }
    </style>
</head>

<body
    class="bg-gradient-to-bl from-[#220000] to-[#220000] via-[#5E0001] text-white flex flex-col font-sans overflow-x-hidden">
    <!-- Navbar -->
    <nav class="w-full px-6 md:px-16 lg:px-24 py-8 flex justify-between items-center z-10 relative">
        <a href="index.html" class="text-2xl md:text-3xl font-heading font-black italic tracking-wider">
            <img src="assets/logo.png" alt="">
        </a>
        <div class="hidden md:flex gap-40 text-sm font-semibold mr-20">
            <a href="index.html" class="hover:text-gray-300 text-lg transition-colors">Home</a>
            <a href="tentang.html" class="hover:text-gray-300 text-lg transition-colors">Tentang</a>
            <a href="produk.html" class="hover:text-gray-300 text-lg transition-colors">Produk</a>
            <a href="kontak.html" class="hover:text-gray-300 text-lg transition-colors">Kontak</a>
        </div>
        <!-- Mobile menu button -->
        <div class="md:hidden">
            <button class="text-white focus:outline-none hover:text-gray-300">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content: Product Slider -->
    <main class="flex-grow flex items-center justify-center relative w-full pt-10 pb-20">
        <!-- Hand Image -->
        <img src="assets/hand.png"
            class="absolute bottom-0 left-[25%] transform -translate-x-1/2 w-[10%] md:w-[10%] lg:w-[30%] z-10"
            alt="Hand holding shoe">
        <div class="w-full mx-auto grid grid-cols-1 lg:grid-cols-2 gap-16 px-6 lg:px-16 items-center">

            <!-- Left Side: Hand, Shoe, Layered Text -->
            <div class="relative flex flex-col justify-center items-center h-[500px] lg:h-[700px] w-full">
                <!-- LAYER 1: (Solid White) -->
                <h1 class="text-7xl md:text-8xl lg:text-[12rem] tracking-wide w-fit relative z-10">
                    <span class="text-white gilroyExtraBold">PR</span><br>
                    <span class="text-white gilroyExtraBold">OD</span><br>
                    <span class="text-white gilroyExtraBold">UK</span><br>
                </h1>

                <!-- Floating Shoe -->
                <img src="assets/sepatu2.png"
                    class="absolute top-[25%] lg:-top-[10%] left-[55%] transform -translate-x-1/2 z-20 transition-opacity duration-300"
                    alt="Product Shoe">

                <!-- LAYER 3: (Outline text overlapping the shoe) -->
                <div class="absolute inset-0 flex flex-col justify-center items-center z-30 pointer-events-none"
                    aria-hidden="true">
                    <h1 class="text-7xl md:text-8xl lg:text-[12rem] tracking-wide w-fit">
                        <span class="text-outline-white gilroyExtraBold">PR</span><br>
                        <span class="text-outline-white gilroyExtraBold">OD</span><br>
                        <span class="gilroyExtraBold">UK</span><br>
                    </h1>
                </div>
            </div>

            <!-- Right Side: Slider Card -->
            <div class="relative w-full flex justify-center items-center h-full">

                <!-- Left Arrow -->
                <button onclick="prevSlide()"
                    class="absolute left-0 lg:-left-12 text-white text-5xl md:text-7xl font-light hover:text-gray-400 transition-colors z-30 focus:outline-none">&lt;</button>

                <!-- Product Card -->
                <div
                    class="bg-[#6E0000] w-full max-w-[400px] aspect-[3/4] p-8 md:p-8 flex flex-col justify-between items-center shadow-md relative">
                    <!-- Shoe inside card -->
                    <div class="flex-grow flex items-center justify-center w-full mt-4">
                        <img id="rightShoe" src="assets/sepatu11.png"
                            class="w-[110%] md:w-[130%] max-w-none transform drop-shadow-2xl transition-opacity duration-300"
                            alt="Card Shoe">
                    </div>

                    <div class="text-center w-full mt-8">
                        <p id="productText"
                            class="text-white font-bold text-sm md:text-base mb-8 px-2 min-h-[48px] transition-opacity duration-300 flex items-center justify-center">
                            zeintin Sepatu Docmart Oxford kulit sintetis
                        </p>
                        <a id="viewBtn" href="produkdetail.html?id=0"
                            class="inline-block bg-[#E5E7EB] text-black font-black text-sm md:text-base py-3 px-12 hover:bg-white transition-colors">
                            VIEW
                        </a>
                    </div>
                </div>

                <!-- Right Arrow -->
                <button onclick="nextSlide()"
                    class="absolute right-0 lg:-right-12 text-white text-5xl md:text-7xl font-light hover:text-gray-400 transition-colors z-30 focus:outline-none">&gt;</button>
            </div>

        </div>
    </main>

    <!-- Slider Javascript -->
    <script>
        const products = [
            { image: 'assets/sepatu11.png', title: 'zeintin Sepatu Docmart Oxford kulit sintetis' },
            { image: 'assets/sepatu21.png', title: 'zeintin Sepatu Boots Kulit Asli Premium' },
            { image: 'assets/sepatu31.png', title: 'zeintin Sepatu Pantofel Pria Formal' },
            { image: 'assets/sepatu41.png', title: 'zeintin Sepatu Casual Pria Sneakers' },
            { image: 'assets/sepatu51.png', title: 'zeintin Sepatu Slip On Kulit Suede' }
        ];

        let currentIndex = 0;

        function updateSlider() {
            const rightShoe = document.getElementById('rightShoe');
            const productText = document.getElementById('productText');
            const viewBtn = document.getElementById('viewBtn');

            // Fade out
            rightShoe.style.opacity = '0';
            productText.style.opacity = '0';

            setTimeout(() => {
                // Update content
                rightShoe.src = products[currentIndex].image;
                productText.textContent = products[currentIndex].title;
                viewBtn.href = `produkdetail.html?id=${currentIndex}`;

                // Fade in
                rightShoe.style.opacity = '1';
                productText.style.opacity = '1';
            }, 300);
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % products.length;
            updateSlider();
        }

        function prevSlide() {
            currentIndex = (currentIndex - 1 + products.length) % products.length;
            updateSlider();
        }
    </script>
</body>

</html>
